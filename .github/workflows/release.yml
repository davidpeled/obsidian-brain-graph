name: Release

# On every push to main: lint, test and build, then publish a release with the next patch version.
#
# The version comes from the existing tags (highest tag, patch + 1), not from a file you must edit.
# To ship a new minor or major version, set it in manifest.json and package.json (above the latest
# tag); the workflow releases that version as written, and patch numbering continues from it.
#
# main is protected (pull request + review required), so the workflow never pushes to it. It puts the
# version into manifest.json, package.json, package-lock.json and versions.json in a release commit
# that is not on main, tags that commit, and publishes the release from it. The tag is the version
# source of truth; the version files on main can lag behind it.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Obsidian's review rules and the layering, with no warnings allowed.
      - run: npm run lint
      # Type-check, unit + architecture tests, production bundle within its size budget.
      - run: npm run build

      - name: Choose the version and stamp it into the version files
        id: version
        run: |
          # shellcheck disable=SC2046
          version=$(node scripts/bump-version.mjs $(git tag --list))
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Commit the stamped files and tag them
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json
          # Nothing to commit when the manifest already carried this exact version.
          git diff --cached --quiet || git commit -m "Release $VERSION"
          # The tag must equal the manifest version exactly (no "v"). Only the tag is pushed.
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        # main.js, manifest.json and styles.css must be separate release assets: that is what Obsidian
        # downloads. manifest.json here is the stamped one, so it matches the tag.
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --verify-tag --title "$VERSION" --generate-notes
